name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            binary_name: imei-tool-windows-amd64.exe
          - goos: windows
            goarch: arm64
            binary_name: imei-tool-windows-arm64.exe
          # macOS (Darwin)
          - goos: darwin
            goarch: amd64
            binary_name: imei-tool-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: imei-tool-darwin-arm64
          # Linux
          - goos: linux
            goarch: amd64
            binary_name: imei-tool-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: imei-tool-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.binary_name }} .
          chmod +x dist/${{ matrix.binary_name }}

      - name: Package macOS .app and .command
        if: matrix.goos == 'darwin'
        run: |
          ARCH="${{ matrix.goarch }}"
          APP_DIR="dist/IMEI-Tool-${ARCH}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # 复制主程序到 MacOS 目录
          cp "dist/${{ matrix.binary_name }}" "${APP_DIR}/Contents/MacOS/imei-tool"
          chmod +x "${APP_DIR}/Contents/MacOS/imei-tool"

          # 生成 Info.plist
          cat << 'PLIST_EOF' > "${APP_DIR}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>imei-tool</string>
              <key>CFBundleIdentifier</key>
              <string>com.xmanlucian.imeitool</string>
              <key>CFBundleName</key>
              <string>IMEI Tool</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST_EOF

          # 生成一键双击启动的脚本
          cat << 'SH_EOF' > "dist/双击打开-IMEI-Tool-${ARCH}.command"
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          cd "$DIR"
          chmod +x "./${{ matrix.binary_name }}"
          "./${{ matrix.binary_name }}"
          SH_EOF
          chmod +x "dist/双击打开-IMEI-Tool-${ARCH}.command"

          # 打包成 zip 方便直接解压运行
          cd dist
          zip -r "imei-tool-darwin-${ARCH}-app.zip" "IMEI-Tool-${ARCH}.app" "双击打开-IMEI-Tool-${ARCH}.command"
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release_files
          find artifacts/ -type f -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
