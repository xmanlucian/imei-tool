<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机 IMEI 在线生成器 & 校验器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e293b 100%);
    --card-bg: rgba(23, 32, 51, 0.75);
    --primary: #38bdf8;
    --primary-hover: #0ea5e9;
    --accent: #818cf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --input-bg: rgba(15, 23, 42, 0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.desc {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 20px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  label {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  input, select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .btn {
    background: linear-gradient(90deg, #38bdf8, #0ea5e9);
    color: #041226;
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.12);
  }
  .results-box {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-textarea {
    width: 100%;
    height: 240px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: #38bdf8;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 1rem;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .status-badge {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    margin-top: 16px;
    display: none;
    line-height: 1.5;
  }
  .status-badge.success {
    display: block;
    background: rgba(34, 197, 94, 0.12);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.25);
  }
  .status-badge.error {
    display: block;
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.25);
  }
  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 10px;
  }
  .footer a {
    color: var(--primary);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>📱 随机 IMEI 生成器 & 校验器</h1>
    <p class="desc">基于 Cloudflare Workers 边缘计算运行。完全符合 GSMA 标准（8位 TAC + 6位流水号 + 模10 Luhn 校验位），支持主流品牌、自定义 TAC 与批量生成。</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-gen-btn">🎲 随机生成</button>
      <button class="tab-btn" id="tab-val-btn">🔍 校验 IMEI</button>
    </div>

    <!-- 生成面板 -->
    <div id="panel-gen">
      <div class="form-grid">
        <div class="form-group">
          <label>设备品牌 (真实 TAC)</label>
          <select id="brand-select">
            <option value="">随机任意品牌</option>
            <option value="apple">Apple (苹果)</option>
            <option value="samsung">Samsung (三星)</option>
            <option value="huawei">Huawei (华为)</option>
            <option value="xiaomi">Xiaomi (小米)</option>
            <option value="google">Google (谷歌)</option>
          </select>
        </div>
        <div class="form-group">
          <label>自定义 TAC (8位，留空按品牌)</label>
          <input type="text" id="custom-tac" placeholder="例如: 35414849" maxlength="8">
        </div>
        <div class="form-group">
          <label>生成数量 (1 ~ 500)</label>
          <input type="number" id="count-input" value="10" min="1" max="500">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; height:46px;">
            <input type="checkbox" id="format-check" style="width:18px; height:18px; cursor:pointer;">
            格式化输出 (带横线)
          </label>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="btn-generate">⚡ 开始生成</button>
        <button class="btn btn-secondary" id="btn-copy">📋 复制全部</button>
        <button class="btn btn-secondary" id="btn-clear">🧹 清空</button>
      </div>

      <div class="results-box">
        <label>生成结果列表</label>
        <textarea id="results-area" class="result-textarea" readonly placeholder="点击上方【开始生成】查看结果..."></textarea>
      </div>
    </div>

    <!-- 校验面板 -->
    <div id="panel-val" style="display:none;">
      <div class="form-group" style="margin-bottom: 16px;">
        <label>输入 15 位 IMEI 码</label>
        <input type="text" id="validate-input" placeholder="例如: 354148491014741" maxlength="18">
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-validate">🔍 立即校验</button>
      </div>
      <div id="validate-badge" class="status-badge"></div>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const tabGenBtn = document.getElementById('tab-gen-btn');
  const tabValBtn = document.getElementById('tab-val-btn');
  const panelGen = document.getElementById('panel-gen');
  const panelVal = document.getElementById('panel-val');

  tabGenBtn.addEventListener('click', function() {
    panelGen.style.display = 'block';
    panelVal.style.display = 'none';
    tabGenBtn.classList.add('active');
    tabValBtn.classList.remove('active');
  });

  tabValBtn.addEventListener('click', function() {
    panelGen.style.display = 'none';
    panelVal.style.display = 'block';
    tabGenBtn.classList.remove('active');
    tabValBtn.classList.add('active');
  });

  const btnGen = document.getElementById('btn-generate');
  const btnCopy = document.getElementById('btn-copy');
  const btnClear = document.getElementById('btn-clear');
  const btnVal = document.getElementById('btn-validate');
  const resultsArea = document.getElementById('results-area');

  btnGen.addEventListener('click', async function() {
    const brand = document.getElementById('brand-select').value;
    const tac = document.getElementById('custom-tac').value.trim();
    const count = document.getElementById('count-input').value;
    const formatted = document.getElementById('format-check').checked;

    btnGen.disabled = true;
    btnGen.textContent = '⏳ 生成中...';

    const params = new URLSearchParams({
      brand: brand,
      tac: tac,
      n: count,
      f: formatted ? '1' : '0'
    });

    try {
      const res = await fetch('/api/generate?' + params.toString());
      const data = await res.json();
      if (data.error) {
        alert('错误: ' + data.error);
        return;
      }
      resultsArea.value = data.imeis.join(String.fromCharCode(10));
    } catch (err) {
      alert('请求失败: ' + err.message);
    } finally {
      btnGen.disabled = false;
      btnGen.textContent = '⚡ 开始生成';
    }
  });

  btnVal.addEventListener('click', async function() {
    const imei = document.getElementById('validate-input').value.trim();
    if (!imei) return;

    btnVal.disabled = true;
    btnVal.textContent = '⏳ 校验中...';

    try {
      const res = await fetch('/api/validate?imei=' + encodeURIComponent(imei));
      const data = await res.json();
      const badge = document.getElementById('validate-badge');
      if (data.valid) {
        badge.className = 'status-badge success';
        badge.textContent = '✓ 校验通过！该 IMEI 结构合法且符合标准 Luhn（模 10）校验算法。';
      } else {
        badge.className = 'status-badge error';
        badge.textContent = '✗ 校验失败！该 IMEI 长度不是 15 位纯数字，或 Luhn 校验位计算不匹配。';
      }
    } catch (err) {
      alert('校验出错: ' + err.message);
    } finally {
      btnVal.disabled = false;
      btnVal.textContent = '🔍 立即校验';
    }
  });

  btnCopy.addEventListener('click', function() {
    if (!resultsArea.value) {
      alert('暂无内容可复制');
      return;
    }
    navigator.clipboard.writeText(resultsArea.value).then(function() {
      alert('已复制到剪贴板！');
    }).catch(function() {
      resultsArea.select();
      document.execCommand('copy');
      alert('已复制到剪贴板！');
    });
  });

  btnClear.addEventListener('click', function() {
    resultsArea.value = '';
  });
});
</script>

</body>
</html>
